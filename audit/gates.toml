# Gates verified in code that keep whole mechanisms off in this build.
#
# extract.py adds `text` to the context of every candidate whose file starts
# with one of `paths`, so one verification clears a whole class of findings.
# Sources: a verifier pass (findings/<version>/verify.jsonl) or reading by hand.
#
# `closes` (optional regex on candidate ids): report.py --hide-gated hides those
# items whatever the model said; without it the fact only informs the model.
#
# `not_built` lists files whose absence from the build graph the gate relies on.
#
# On a new Chromium version, re-check the cited lines (`check` lists
# path:needle pairs; extract.py fails if a needle is no longer in that file).

[[gate]]
paths = ["components/optimization_guide/core/model_execution/"]
check = ["components/optimization_guide/core/model_execution/model_execution_fetcher_impl.cc:IsAccessTokenRequiredForFeature(feature) && access_token.empty()",
         "components/optimization_guide/core/access_token_helper.cc:HasPrimaryAccount(signin::ConsentLevel::kSignin)"]
text = """Remote model execution (ModelExecutionFetcherImpl, model_execution_fetcher_impl.cc:108)
does not send when IsAccessTokenRequiredForFeature(feature) is true and the access token is
empty; the token is empty without a signed-in account (access_token_helper.cc:69), which is
always the case in this build. Features that do NOT need a token (remote_model_execution_common.cc
IsAccessTokenRequiredForFeature): kScamDetection, kGeminiAntiscamProtection, kAmountExtraction,
kCardRecommendations, and kFormsClassifications / kPasswordChangeSubmission only if their
bypass feature is enabled. Requests for those are judged by their callers."""
closes = '^ann:(?!(amount_extraction|forms_classifications|gemini_antiscam_protection|password_change_submission|scam_detection)_)\w+_model_execution$'
source = "fable verifier 2026-11-07, re-read by hand"


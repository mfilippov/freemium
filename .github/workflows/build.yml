name: build

# The build of one CPU as a chain of stages (stage.yml), each continuing where the previous one
# stopped, like ungoogled-chromium-windows. After the stage that finishes the build the rest
# are skipped.

on:
  workflow_call:
    inputs:
      cpu:
        type: string
        required: true
    outputs:
      package:
        value: ${{ jobs.result.outputs.package }}
      sha256:
        value: ${{ jobs.result.outputs.sha256 }}

permissions: {}

jobs:
  s1:
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 1
  s2:
    needs: s1
    if: needs.s1.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 2
  s3:
    needs: s2
    if: needs.s2.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 3
  s4:
    needs: s3
    if: needs.s3.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 4
  s5:
    needs: s4
    if: needs.s4.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 5
  s6:
    needs: s5
    if: needs.s5.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 6
  s7:
    needs: s6
    if: needs.s6.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 7
  s8:
    needs: s7
    if: needs.s7.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 8
  s9:
    needs: s8
    if: needs.s8.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 9
  s10:
    needs: s9
    if: needs.s9.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 10
  s11:
    needs: s10
    if: needs.s10.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 11
  s12:
    needs: s11
    if: needs.s11.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 12
  s13:
    needs: s12
    if: needs.s12.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 13
  s14:
    needs: s13
    if: needs.s13.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 14
  s15:
    needs: s14
    if: needs.s14.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 15
  s16:
    needs: s15
    if: needs.s15.outputs.finished == 'false'
    uses: ./.github/workflows/stage.yml
    permissions:
      contents: read
    with:
      cpu: ${{ inputs.cpu }}
      stage: 16
  result:
    needs: [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10, s11, s12, s13, s14, s15, s16]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      package: ${{ steps.result.outputs.package }}
      sha256: ${{ steps.result.outputs.sha256 }}
    steps:
      - id: result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$NEEDS" >/dev/null; then
            echo "::error::a stage failed"; exit 1
          fi
          fin=$(jq -c '[.[] | select(.outputs.finished == "true")] | first // empty' <<<"$NEEDS")
          if [[ -z $fin ]]; then
            echo "::error::the build did not finish in 16 stages"; exit 1
          fi
          jq -r '.outputs | "package=\(.package)", "sha256=\(.sha256)"' <<<"$fin" >>"$GITHUB_OUTPUT"
